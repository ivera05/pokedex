spring.application.name=pokedex

# --- Database Configuration ---
#spring.datasource.url=jdbc:postgresql://pokedex-db:5432/pokedex
spring.datasource.url=jdbc:postgresql://localhost:5432/pokedex
spring.datasource.username=pokedex_user
spring.datasource.password=pokedex_password

# --- Hikari Connection Pool ---
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=180000
spring.datasource.hikari.maximum-pool-size=5

# --- Flyway Migrations ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true


# --- JPA / Hibernate ---
# 'validate' is safest when using Flyway to ensure DB matches entities
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Security & JWT ---
app.jwt.secret=019c7e9f-d7d2-743c-8bac-10fd9279f703
app.jwt.expiration-ms=36000000

# --- Logging ---
# Useful for debugging JSON mapping and Kotlin reflection issues
logging.level.org.springframework=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=INFO
#logging.level.org.flywaydb=DEBUG
#logging.level.org.flywaydb.core=DEBUG
# High verbosity for JSON issues
logging.level.com.fasterxml.jackson=DEBUG
logging.level.com.pokedex=DEBUG